<div class="container mt-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Employee List</h2>
    <a mat-raised-button color="primary" routerLink="/employee/create">
      <mat-icon>add</mat-icon> Add Employee
    </a>
  </div>

  <h2 style="color: red;">{{envService.appEnvTitle()}}</h2>

  <!-- Material Table -->
  <table mat-table [dataSource]="employee" class="mat-elevation-z8 w-100" *ngIf="employee.length >= 0">
    
    <ng-container matColumnDef="eid">
      <th mat-header-cell *matHeaderCellDef> EID </th>
      <td mat-cell *matCellDef="let element"> {{element.eid}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="salary">
      <th mat-header-cell *matHeaderCellDef> Salary </th>
      <td mat-cell *matCellDef="let element"> {{element.salary | currency}} </td>
    </ng-container>

    <ng-container matColumnDef="image">
      <th mat-header-cell *matHeaderCellDef> Image </th>
      <td mat-cell *matCellDef="let element">
        <img *ngIf="element.profileImage" 
             [src]="'http://localhost:9177/Angular_SpringBoot_H2/img' + element.profileImage" 
             style="height: 40px; border-radius: 4px;">
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="accent" (click)="editEmployee(element.eid)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteEmployee(element.eid)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
   <ng-container matColumnDef="createdate">
      <th mat-header-cell *matHeaderCellDef> Date&Time </th>
      <td mat-cell *matCellDef="let element"> {{element.createAt}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['eid', 'email', 'name', 'salary', 'image', 'actions','createdate']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['eid', 'email', 'name', 'salary', 'image', 'actions','createdate'];"></tr>
  </table>
</div>

<hr/>

<!-- Signal & Counter Section -->
<div class="container mt-4">
  <mat-card class="p-3">
    <div class="mb-3">
      <button mat-mini-fab color="primary" (click)="counter('minus')">-</button>
      <span class="mx-3 fs-4">{{count}}</span>
      <button mat-mini-fab color="primary" (click)="counter('plus')">+</button>
    </div>

    <div class="mb-3">
      <button mat-flat-button [disabled]="btndisable" class="me-2">Click Here</button>
      <button mat-stroked-button (click)="toggle()">Toggle</button>
    </div>

    <h3>Signal value: <mat-chip>{{dataSignal()}}</mat-chip></h3>
    <button mat-raised-button (click)="handleEvent()">Signal check in console</button>
  </mat-card>
</div>

<div class="container mt-5">
  <h1>Counter App (Signals)</h1>
  <div class="display-4 mb-3">{{counter1()}}</div>
  
  <div class="btn-group">
    <button mat-raised-button (click)="increment()">+</button>
    <button mat-button (click)="reset()">Reset</button>
    <button mat-raised-button (click)="decrement()">-</button>
  </div>

  <div class="mt-4">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [value]="name()" (input)="setValue($event.target.value)">
    </mat-form-field>
    <button mat-button color="warn" (click)="resetVal()">Reset</button>
  </div>
</div>

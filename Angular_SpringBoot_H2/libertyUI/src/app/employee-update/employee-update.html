
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
                    <button class="back-btn" (click)="goBack()">
                    &laquo; Go Back
                    </button>
            <h2 class="card-title mb-4">Update Employee</h2>
             <span  style="color: red;"><h2>{{envService.appEnvTitle()}}</h2></span>
                <form [formGroup]="employeeForm" (ngSubmit)="updateEmployee()">
                    <div class="mb-3">
                        <label for ="name" class="form-label">Name</label>
                        <input type="text" id="name"  class="form-control" formControlName="name" required />                        
                    </div> 
                     <div class="mb-3">
                        <label for ="email" class="form-label">Email</label>
                        <input type="text" id="email"  class="form-control" formControlName="email" required />                        
                    </div> 
                     <div class="mb-3">
                        <label for ="password" class="form-label">Password</label>
                        <input type="password" id="password"  class="form-control" formControlName="password"  required/>                        
                    </div> 
                    <div class="mb-3">
                        <label for ="salary" class="form-label">Salary</label>
                        <input type="number" id="salary"  class="form-control" formControlName="salary" required/>                        
                    </div> 
                    <div class="mb-3">
                        <label for ="profileImage" class="form-label">Image</label>
                        <input type="file" id="profileImage"  class="form-control" (change)="onFileSelect($event)"/>                        
                    </div> 
                    <button type="submit" class="btn btn-primary" id="submit" [disabled]="employeeForm.invalid">
                        Update Employee
                    </button>
                </form>               
        </div>
    </div>
</div>

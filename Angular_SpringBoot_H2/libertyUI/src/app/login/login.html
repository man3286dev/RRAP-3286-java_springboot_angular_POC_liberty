<div class="login-wrapper">
  <mat-card class="login-card mat-elevation-z3">
    <mat-card-header>
      <mat-card-title>Sign In</mat-card-title>      
    </mat-card-header>
    <br/>
    <div class="marquee-container">
  <div class="marquee-text">
    🔥  <h6 style="color: red;" marquee>{{envService.appEnvTitle()}}</h6> 
  </div>
</div>
   
    

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <!-- Username Input Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter username">
          <mat-icon matSuffix>person</mat-icon>
          @if (loginForm.get('username')?.hasError('required')) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>
        <br/>

        <!-- Password Input Field -->
        <mat-form-field  appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter password">
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (loginForm.get('password')?.hasError('required')) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <!-- Action Submit Execution Button -->
        <div class="form-actions"> 
            
          <button mat-flat-button color="primary" class="full-width-btn" type="submit"   [disabled]="loginForm.invalid">
            Login
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
